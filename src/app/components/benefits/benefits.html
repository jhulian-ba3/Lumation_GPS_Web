<section class="benefits" id="ventajas">
  <div class="container">
    <div class="benefits__header">
      <span class="benefits__eyebrow">Por qué RoutelQ</span>
      <h2 class="benefits__title">Todo lo que necesitas para gestionar tu flota</h2>
    </div>

    <div class="benefits__grid">
      @for (benefit of benefits; track benefit.title) {
        <article class="benefit-card">
          <div class="benefit-card__icon" [attr.data-icon]="benefit.icon">
            @switch (benefit.icon) {
              @case ('route') {
                <svg viewBox="0 0 24 24" width="28" height="28">
                  <circle cx="8" cy="5" r="2" fill="currentColor"/>
                  <circle cx="8" cy="19" r="2" fill="currentColor"/>
                  <circle cx="18" cy="12" r="2" fill="currentColor"/>
                  <path d="M8 5v6c0 2 2 3 5 1s5 0 5 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
              }
              @case ('vehicle') {
                <svg viewBox="0 0 24 24" width="28" height="28">
                  <path d="M5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11M5 11h14M5 11v6a1 1 0 001 1h1a1 1 0 001-1v-1h8v1a1 1 0 001 1h1a1 1 0 001-1v-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="8" cy="14" r="1.2" fill="currentColor"/>
                  <circle cx="16" cy="14" r="1.2" fill="currentColor"/>
                </svg>
              }
              @case ('driver') {
                <svg viewBox="0 0 24 24" width="28" height="28">
                  <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2" fill="none"/>
                  <path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
              }
              @case ('adapt') {
                <svg viewBox="0 0 24 24" width="28" height="28">
                  <rect x="5" y="5" width="14" height="14" rx="3" stroke="currentColor" stroke-width="2" fill="none"/>
                  <path d="M5 9h14M9 5v14" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
              }
            }
          </div>
          <div class="benefit-card__content">
            <h3 class="benefit-card__title">{{ benefit.title }}</h3>
            <p class="benefit-card__desc">{{ benefit.description }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
