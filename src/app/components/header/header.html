<header class="header" [class.header--scrolled]="isScrolled()">
  <div class="container header__inner">

    <!-- Logo -->
    <a class="header__logo" href="/" aria-label="Fleet Control home">
      <span class="header__logo-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="28" rx="6" fill="#D71920"/>
          <path d="M6 18L10 10L14 15L18 8L22 18H6Z" fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
          <circle cx="8" cy="20" r="2" fill="white"/>
          <circle cx="20" cy="20" r="2" fill="white"/>
        </svg>
      </span>
      <span class="header__logo-text">FLEET<span class="header__logo-accent">CONTROL</span></span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="header__nav" aria-label="Main navigation">
      <ul class="header__nav-list">
        @for (link of navLinks; track link.anchor) {
          <li>
            <a
              class="header__nav-link"
              [href]="link.anchor"
              (click)="$event.preventDefault(); scrollTo(link.anchor)"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <!-- CTA Button (desktop) -->
    <button class="btn-primary header__cta" (click)="scrollTo('#contacto')">
      Solicitar una demostración
    </button>

    <!-- Hamburger (mobile) -->
    <button
      class="header__hamburger"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Abrir menú"
    >
      <span class="header__hamburger-bar" [class.header__hamburger-bar--open-1]="isMobileMenuOpen()"></span>
      <span class="header__hamburger-bar" [class.header__hamburger-bar--open-2]="isMobileMenuOpen()"></span>
      <span class="header__hamburger-bar" [class.header__hamburger-bar--open-3]="isMobileMenuOpen()"></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="header__mobile" [class.header__mobile--open]="isMobileMenuOpen()">
    <nav>
      <ul class="header__mobile-list">
        @for (link of navLinks; track link.anchor) {
          <li>
            <a
              class="header__mobile-link"
              [href]="link.anchor"
              (click)="$event.preventDefault(); scrollTo(link.anchor)"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
      <button class="btn-primary header__mobile-cta" (click)="scrollTo('#contacto')">
        Solicitar una demostración
      </button>
    </nav>
  </div>
</header>
