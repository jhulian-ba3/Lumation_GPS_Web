<section class="faq" id="faq">
  <div class="container">
    <div class="faq__header">
      <span class="faq__eyebrow">Preguntas frecuentes</span>
      <h2 class="faq__title">Resolvemos tus dudas</h2>
      <p class="faq__subtitle">
        Información clara y transparente sobre la plataforma, la implementación y el soporte.
      </p>
    </div>

    <div class="faq__list">
      @for (item of items; track item.question; let i = $index) {
        <div class="faq__item" [class.faq__item--open]="openIndex() === i">
          <button
            class="faq__question"
            type="button"
            (click)="toggle(i)"
            [attr.aria-expanded]="openIndex() === i"
          >
            <span class="faq__question-text">{{ item.question }}</span>
            <span class="faq__question-icon" [class.faq__question-icon--open]="openIndex() === i">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
          <div class="faq__answer-wrapper">
            @if (openIndex() === i) {
              <div class="faq__answer">
                <p>{{ item.answer }}</p>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
